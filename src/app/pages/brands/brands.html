<section class="py-5 mt-5">
  <div class="container mx-auto">
    <h1 _ngcontent-xks-c10="" class="text-3xl font-bold text-green-700 mb-8 text-center">All Brands</h1>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
      @for (brand of brandsList; track brand._id) {
        <div (click)="openModal(brand._id)" class="cursor-pointer border p-4 rounded-lg">
            <img [src]="brand.image" [alt]="brand.name">
            <h3 class="text-center">{{brand.name}}</h3>
        </div>
      }
    </div>
  </div>
</section>

@if (brandDetails) {
  <div id="brand-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 bg-opacity-50">
    <div class="relative p-4 w-full max-w-md bg-white rounded-lg shadow-sm">
      <div class="flex items-center justify-between p-4 border-b">
        <h3 class="text-xl font-semibold text-green-700">{{brandDetails.name}}</h3>
        <button (click)="brandDetails = null" class="text-gray-400 hover:text-gray-900 text-2xl">&times;</button>
      </div>
      <div class="p-6 text-center">
        <img [src]="brandDetails.image" class="mx-auto w-40 mb-4" [alt]="brandDetails.name">
        <p class="text-gray-500 uppercase font-medium">{{brandDetails.slug}}</p>
      </div>
    </div>
  </div>
}
