<section class="py-5 mt-5">
    <div class="container mx-auto px-4">
    <h1 class="text-3xl font-bold text-green-700 mb-8 text-center">All Categories</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (cat of categoriesList; track cat._id) {
        <div class="group cursor-pointer bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-lg transition-all duration-300 overflow-hidden">
            <div class="h-64 overflow-hidden">
            <img [src]="cat.image" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" [alt]="cat.name">
            </div>
            <div class="p-4 text-center">
            <h3 class="text-xl font-semibold text-green-600 group-hover:text-green-500">{{cat.name}}</h3>
            </div>
        </div>
    }
    </div>
    </div>
</section>
