<section class="w-1/2 bg-gray-200 shadow-lg rounded-lg mx-auto  p-4 my-10 mt-15">
    <h1 class="text-green-700 text-center text-3xl font-bold mt-3"> {{'checkout.paynow'|translate}}:</h1>
    <form [formGroup]="paymentform" (ngSubmit)="submitForm()">

        <div class="mb-6">
            <label for="uDetails" class="block mb-2.5 text-lg font-light text-green-700"> {{'checkout.details'|translate}} :</label>
            <input placeholder="{{'checkout.enterdetails'|translate}}..." formControlName="details" type="text" id="uDetails" 
            class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-green-700 focus:border-green-700 block w-full px-3 py-2.5 shadow-xs placeholder:text-body" />
        </div>

        <div class="mb-6">
            <label for="uPhone" class="block mb-2.5 text-lg font-light text-green-700">{{'checkout.phone'|translate}} :</label>
            <input placeholder="{{'checkout.enterphone'|translate}}..." formControlName="phone" type="tel" id="uPhone" 
            class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-green-700 focus:border-green-700 block w-full px-3 py-2.5 shadow-xs placeholder:text-body" />
        </div>

        <div class="mb-6">
            <label for="uCity" class="block mb-2.5 text-lg font-light text-green-700">{{'checkout.city'|translate}} :</label>
            <input placeholder="{{'checkout.entercity'|translate}}..." formControlName="city" type="text" id="uCity" 
            class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-green-700 focus:border-green-700 block w-full px-3 py-2.5 shadow-xs placeholder:text-body" />
        </div>

        <button type="submit"  [disabled]="paymentform.invalid"
        class=" bg-green-700 text-white py-2 px-4 rounded-md cursor-pointer hover:bg-green-500 transition mx-auto flex disabled:bg-green-200">
            {{'checkout.submit'|translate}}
        </button>
    </form>

</section>
