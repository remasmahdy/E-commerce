<section class="py-5 mt-10 mx-5 bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4">
    <div class="flex justify-between items-center mb-8 border-b pb-4">
        <h2 class="text-3xl font-bold text-green-700">My Wishlist</h2>
        <span class="bg-green-100 text-green-700 px-4 py-1 rounded-full font-semibold">
        Items: {{ wishlistItems.length }}
        </span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        @for (item of wishlistItems; track item._id) {
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow group">
            <div class="relative">
            <img [src]="item.imageCover" [alt]="item.title" class="w-full h-60 object-contain p-4">
            
            <button (click)="removeItem(item._id)" class="absolute top-2 right-2 bg-white/80 hover:bg-red-50 text-red-500 p-2 rounded-full shadow-sm transition-colors">
                <i class="fa-solid fa-trash-can"></i>
            </button>
            </div>

            <div class="p-4">
            <h3 class="font-bold text-gray-800 line-clamp-1 mb-1">{{ item.title }}</h3>
            <p class="text-green-600 font-bold mb-4">{{ item.price | currency }}</p>
            
            <button (click)="addToCartFromWish(item._id)" class="w-full bg-green-700 text-white py-2 rounded-lg hover:bg-green-800 transition-colors flex items-center justify-center gap-2">
                <i class="fa-solid fa-cart-plus"></i>
                {{'home.addtocart'|translate}}
            </button>
            </div>
        </div>
        } @empty {
        <div class="col-span-full text-center py-20 bg-white rounded-2xl border-2 border-dashed border-gray-200">
            <i class="fa-solid fa-heart-crack text-6xl text-gray-300 mb-4"></i>
            <p class="text-xl text-gray-500 mb-6">Your wishlist is lonely. Add some products!</p>
            <button routerLink="/products" class="bg-green-700 text-white px-8 py-3 rounded-lg hover:bg-green-800 transition-colors">
            Explore Products
            </button>
        </div>
        }
    </div>
    </div>
</section>
