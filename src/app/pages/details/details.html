@if (prodData) {
    <section class="py-5 mt-10 mx-5">
    <h1 class="text-4xl text-green-700 text-center">{{'details.proddetails'|translate}} </h1>
    <div class="grid md:grid-cols-[20%_minmax(0,1fr)] items-center my-10">
        <div class="m-3">
        <img class="w-full object-contain " [src]="prodData.imageCover" [alt]="prodData.title">
    </div>
    <div>
        <h2> {{prodData.title}} </h2>
        <p class="text-gray-700 my-2">{{prodData.description}}</p>
        <h3 class="text-green-700"> {{prodData.category.name}}</h3>
        <div class="flex justify-between items-center">
            <span>{{prodData.price}} EGP</span>
            <div class="flex items-center">
                <i class="fas fa-star text-yellow-300"></i>
                <span class="text-gray-500"> {{prodData.ratingsAverage}} </span>
            </div>
        </div>

        <div class="flex items-center gap-2 mt-10">
            <button (click)="addProductToCart(prodData._id)" class="py-3 px-4 text-white rounded-lg bg-green-700 cursor-pointer w-full hover:bg-green-800 transition-colors">
                {{'details.addtocart'|translate}}
            </button>

            <button (click)="addToWish(prodData._id)" class="p-2 border border-gray-100 rounded-lg hover:bg-gray-50 transition-colors shrink-0">
                <i class="fa-solid fa-heart text-3xl transition-colors cursor-pointer"
                    [class.text-red-600]="wishlistIds.includes(prodData._id)"
                    [class.text-gray-400]="!wishlistIds.includes(prodData._id)">
                </i>
            </button>
        </div>
        
    </div>
    </div>
</section>
}
